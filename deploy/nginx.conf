# aibank — TLS termination in front of the service.
#
# The app is plain `http.server` on an internal network. Everything that makes
# the edge safe lives here.

# Rate limit keyed on source address, applied to the auth endpoints only.
# This is the EDGE half of a two-layer defence: nginx caps the request rate
# cheaply, and aibank's own per-address throttle (AIBANK_IP_LOCKOUT_THRESHOLD)
# still applies because an edge limit disappears the moment someone runs the
# container without this proxy.
limit_req_zone $binary_remote_addr zone=aibank_auth:10m rate=10r/m;
limit_req_status 429;

upstream aibank {
    server aibank:8000;
    keepalive 16;
}

# Plain HTTP exists only to redirect. A session token must never be issued
# over a cleartext connection.
server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS is deliberately commented out, not enabled by default: it is
    # effectively irreversible for the duration of max-age, so a self-hoster
    # testing with a self-signed certificate on a real hostname would lock
    # their own browser out. Turn it on once you have a trusted certificate.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # A payout request is a few hundred bytes. Anything larger is either a bug
    # or an attempt to make us allocate.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Do not advertise the version to a scanner.
    server_tokens off;

    location = /health {
        proxy_pass http://aibank;
        access_log off;
    }

    # Auth endpoints: rate limited. burst=5 with nodelay lets a human who
    # mistypes a password twice through immediately while still capping a
    # script at the zone rate.
    location ~ ^/v1/auth/(login|register)$ {
        limit_req zone=aibank_auth burst=5 nodelay;

        proxy_pass http://aibank;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: appending to a
        # client-supplied header lets the caller prepend whatever they like,
        # and aibank reads the LEFTMOST entry. Overwriting with the address
        # nginx actually accepted the connection from makes the header
        # unspoofable. aibank only trusts it when AIBANK_TRUSTED_PROXY=1.
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location / {
        proxy_pass http://aibank;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
