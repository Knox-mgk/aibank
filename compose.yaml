# aibank — self-hosted stack: the service, TLS termination, and the two timers.
#
# The service itself NEVER binds a public port here. It listens on an internal
# network only and nginx terminates TLS in front of it, because the dashboard
# posts a password and then carries a session token: that token on the wire in
# clear is the whole account.
#
#   cp .env.example .env    # then edit it -- the service refuses to boot without secrets
#   docker compose run --rm aibank migrate
#   docker compose run --rm aibank create-user you@example.com
#   docker compose up -d

services:
  aibank:
    build: .
    image: aibank:local
    restart: unless-stopped
    env_file: .env
    environment:
      AIBANK_DB: /var/lib/aibank/aibank.db
      AIBANK_HOST: 0.0.0.0
      AIBANK_PORT: "8000"
    volumes:
      - aibank-data:/var/lib/aibank
    # No `ports:` by design. Reaching this from the host means going through
    # nginx, which is the only thing holding a certificate.
    expose:
      - "8000"
    networks: [internal]
    # Single process is a correctness boundary, not a tuning choice:
    # db.write() serialises on a process-global lock, so two replicas against
    # one SQLite file would reintroduce the policy-check/hold race. Scaling
    # out requires Postgres behind Database, never a second replica.
    deploy:
      replicas: 1

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [aibank]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [internal]

  # Holds expire so a lost webhook cannot freeze an agent's money forever;
  # that only helps if something actually runs the sweeper. A compose timer is
  # part of the deliverable, not an exercise for the operator.
  sweeper:
    image: aibank:local
    restart: unless-stopped
    depends_on: [aibank]
    env_file: .env
    environment:
      AIBANK_DB: /var/lib/aibank/aibank.db
    volumes:
      - aibank-data:/var/lib/aibank
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          python -m aibank.cli sweep-holds || echo "sweep failed rc=$$?" >&2
          python -m aibank.cli needs-reconciliation
        done

  # A ledger with no backup is one disk away from being unauditable. Writes a
  # verified snapshot (integrity_check + trial balance, read back from the
  # copy) into a separate volume every six hours and keeps 28 of them.
  backup:
    image: aibank:local
    restart: unless-stopped
    depends_on: [aibank]
    env_file: .env
    environment:
      AIBANK_DB: /var/lib/aibank/aibank.db
    volumes:
      - aibank-data:/var/lib/aibank
      - aibank-backups:/var/backups/aibank
    networks: [internal]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python -m aibank.cli backup --dir /var/backups/aibank \
            || echo "BACKUP FAILED rc=$$?" >&2
          ls -1t /var/backups/aibank/aibank-*.db 2>/dev/null \
            | tail -n +29 | xargs -r rm -f
          sleep 21600
        done

volumes:
  aibank-data:
  aibank-backups:

networks:
  internal:
